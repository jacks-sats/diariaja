ext {
    // 23 (Android 6.0) — exigido pelo @capgo/capacitor-social-login (Credential
    // Manager / Google Play Services do login Google nativo). Cobre ~99% dos aparelhos.
    minSdkVersion = 23
    // Play exige compileSdk/targetSdk = 35 (Android 15) pra apps novos
    // desde 31-ago-2025 e pra updates desde 1-nov-2025.
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '10.1.1'
}