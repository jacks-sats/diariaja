apply plugin: 'com.android.application'

// Versionamento dinâmico:
//  - versionCode pode ser sobrescrito via env DIARIAJA_VERSION_CODE (CI).
//  - versionName pode ser sobrescrito via env DIARIAJA_VERSION_NAME.
// Defaults razoáveis pra build local sem env (mas SEMPRE bumpar antes de
// subir nova release na Play Console).
def computedVersionCode = (System.getenv("DIARIAJA_VERSION_CODE") ?: "21").toInteger()
def computedVersionName = System.getenv("DIARIAJA_VERSION_NAME") ?: "1.3.0"

android {
    namespace "com.diariaja.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.diariaja.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName computedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Assinatura de release lida de ENV (injetada pelo CI — workflow android-aab.yml).
    // NUNCA commitar a keystore nem as senhas: tudo vem de GitHub Secrets em runtime.
    // Sem as envs (build local / Android Studio), o bloco fica vazio e NÃO é referenciado
    // abaixo — então `assembleRelease`/Generate Signed Bundle seguem funcionando como hoje
    // (você assina manualmente pelo Android Studio).
    signingConfigs {
        release {
            def ksPath = System.getenv("DIARIAJA_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("DIARIAJA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DIARIAJA_KEY_ALIAS")
                keyPassword System.getenv("DIARIAJA_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // IMPORTANTE: minifyEnabled FICA DESLIGADO.
            // Com R8 ligado e proguard-rules.pro vazio, o ofuscador removia/renomeava
            // classes que os plugins Capacitor (@capgo/capacitor-social-login,
            // @capgo/capacitor-updater) carregam via reflection — causando crash
            // NATIVO logo após o login (só no AAB release; no debug funcionava).
            // A Play Store NÃO exige ofuscação. Padrão do Capacitor = false.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Só assina com a release key quando o CI forneceu a keystore via env.
            // Localmente (sem env) o AAB sai sem essa config — o Android Studio
            // aplica a assinatura no "Generate Signed Bundle".
            if (System.getenv("DIARIAJA_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Mantém debug rápido — sem ofuscação
            minifyEnabled false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}


