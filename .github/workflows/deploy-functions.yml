name: Deploy Edge Functions

# Publica as Edge Functions do Supabase automaticamente.
#
# Dispara quando algo em supabase/functions/** muda na main (após o merge do PR)
# e também na branch de trabalho atual — assim dá pra publicar ANTES do merge,
# direto do celular (é só re-rodar o job na aba Actions depois de cadastrar os
# segredos). Também pode ser disparado manualmente em "Run workflow".
#
# Pré-requisito (1x): cadastrar 1 segredo no GitHub
#   Settings → Secrets and variables → Actions → New repository secret
#     - SUPABASE_ACCESS_TOKEN  (Supabase → Account → Access Tokens → Generate new)
#
# O project-ref NÃO é segredo (já é público na URL do projeto), então fica
# fixo abaixo — assim você só precisa cadastrar o token.

on:
  push:
    branches:
      - main
      - claude/bora-ubKf5
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy de todas as Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Faz deploy de cada função (ignora a pasta _shared, que não é função).
          # CRÍTICO: mp-webhook e mp-oauth são chamadas SEM JWT (Mercado Pago /
          # redirect de browser); lookup-by-cpf e signup-empresa são chamadas
          # PRÉ-LOGIN (usuário sem sessão, manda a chave publicável que não é
          # JWT). Todas precisam de --no-verify-jwt, senão o gateway devolve 401
          # antes do código rodar. As demais mantêm o default (verify_jwt = true)
          # e exigem JWT do usuário. Espelha o supabase/config.toml.
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            case "$name" in
              mp-webhook|mp-oauth|lookup-by-cpf|signup-empresa) flags="--no-verify-jwt" ;;
              *)                    flags="" ;;
            esac
            echo "▶ deploy $name $flags"
            supabase functions deploy "$name" $flags --project-ref rpszebrrrasoijfdvner
          done
