<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DiáriaJá</title>
    <meta name="description" content="Marketplace de diárias — conecte empregadores e diaristas" />
    <meta name="theme-color" content="#FF6B35" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DiáriaJá" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: var(--bg-app, #f0f2f5); transition: background .3s; }

      /* ── Variáveis padrão (light mode) ── */
      :root {
        --bg-app:      #f0f2f5;
        --bg-card:     #ffffff;
        --bg-surface:  #f8fafc;
        --bg-subtle:   #f1f5f9;
        --text-1:      #0f172a;
        --text-2:      #64748b;
        --text-3:      #94a3b8;
        --text-label:  #475569;
        --border:      #e2e8f0;
        --border-sub:  #f1f5f9;
        --input-bg:    #ffffff;
        --btn-edit-bg: #f1f5f9;
        --btn-edit-cl: #475569;
        --modal-bg:    #ffffff;
        --overlay-bg:  rgba(15, 23, 42, 0.6);
        --shadow:      rgba(0, 0, 0, 0.06);
        /* aliases legados */
        --text-primary:   #0f172a;
        --text-secondary: #64748b;
        --border-color:   #e2e8f0;
      }

      /* ── Dark mode — ativado pelo JS via data-dark="1" no body ── */
      body[data-dark="1"] {
        --bg-app:      #0f172a;
        --bg-card:     #1e293b;
        --bg-surface:  #111827;
        --bg-subtle:   #1e293b;
        --text-1:      #f1f5f9;
        --text-2:      #94a3b8;
        --text-3:      #64748b;
        --text-label:  #94a3b8;
        --border:      #334155;
        --border-sub:  #1e293b;
        --input-bg:    #0f172a;
        --btn-edit-bg: #334155;
        --btn-edit-cl: #94a3b8;
        --modal-bg:    #1e293b;
        --overlay-bg:  rgba(0, 0, 0, 0.8);
        --shadow:      rgba(0, 0, 0, 0.2);
        /* aliases legados */
        --text-primary:   #f1f5f9;
        --text-secondary: #94a3b8;
        --border-color:   #334155;
      }

      /* ── Dark mode: regras globais abrangentes ── */

      /* Inputs e formulários */
      body[data-dark="1"] input,
      body[data-dark="1"] textarea,
      body[data-dark="1"] select {
        background: var(--input-bg) !important;
        color: var(--text-1) !important;
        border-color: var(--border) !important;
      }

      /* Botões sem cor de fundo inline */
      body[data-dark="1"] button:not([style*="background:#"]):not([style*="background: #"]):not([style*="background:linear"]):not([style*="background: linear"]) {
        background: var(--bg-card) !important;
        color: var(--text-1) !important;
      }

      /* Placeholder de texto */
      body[data-dark="1"] ::placeholder { color: var(--text-3) !important; opacity: 1; }

      /* Scrollbars discretas no escuro */
      body[data-dark="1"] ::-webkit-scrollbar { width:6px; height:6px; }
      body[data-dark="1"] ::-webkit-scrollbar-track { background: var(--bg-app); }
      body[data-dark="1"] ::-webkit-scrollbar-thumb { background: var(--border); border-radius:3px; }

      /* Transição suave ao alternar */
      #root, #root * { transition: background-color .2s, color .15s, border-color .2s; }
      /* Exceções: imagens, SVGs e elementos com transições próprias não devem transitar */
      img, svg, video, [style*="transition"] { transition: none !important; }

      /* Textarea e select também pegam o tema (light mode) */
      textarea, select {
        background: var(--input-bg, #fff);
        color: var(--text-1, #0f172a);
        border-color: var(--border, #e2e8f0);
      }
    </style>
  </head>
  <body>
    <!-- Splash nativo: aparece ANTES do React carregar, evita tela branca -->
    <div id="root">
      <div id="native-splash" style="
        position:fixed;inset:0;
        background:linear-gradient(160deg,#060d1f 0%,#0d1a35 60%,#0f2040 100%);
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        font-family:system-ui,sans-serif;z-index:9999;">
        <div style="font-size:56px;margin-bottom:16px;filter:drop-shadow(0 0 24px #FF6B35)">⚡</div>
        <div style="font-size:32px;font-weight:900;color:#fff;letter-spacing:-1px">
          Diária<span style="color:#FF6B35">Já</span>
        </div>
        <div style="color:#64748b;font-size:14px;margin-top:12px">Carregando...</div>
        <div style="margin-top:32px;width:48px;height:4px;background:#1e293b;border-radius:2px;overflow:hidden">
          <div style="height:100%;background:linear-gradient(90deg,#FF6B35,#fbbf24);border-radius:2px;
            animation:spl 1.4s ease-in-out infinite;width:60%"></div>
        </div>
        <style>
          @keyframes spl{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
        </style>
      </div>
    </div>

    <!-- Auto-recuperação: se um script falhar (bundle com hash antigo), limpa SW e recarrega -->
    <script>
      window.addEventListener("error", function(e) {
        if (e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              var cleared = regs.length > 0;
              regs.forEach(function(r) { r.unregister(); });
              if ("caches" in window) {
                caches.keys().then(function(keys) {
                  keys.forEach(function(k) { caches.delete(k); });
                });
              }
              // Recarrega só uma vez para evitar loop infinito
              if (cleared && !sessionStorage.getItem("sw_recovered")) {
                sessionStorage.setItem("sw_recovered", "1");
                window.location.reload();
              }
            });
          }
        }
      }, true);
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Registro do Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() {
          navigator.serviceWorker.register("/sw.js")
            .then(function(reg) {
              // Força atualização imediata se houver nova versão esperando
              reg.addEventListener("updatefound", function() {
                var newSW = reg.installing;
                if (newSW) {
                  newSW.addEventListener("statechange", function() {
                    if (newSW.state === "installed" && navigator.serviceWorker.controller) {
                      newSW.postMessage({ type: "SKIP_WAITING" });
                    }
                  });
                }
              });
            })
            .catch(function() {});

          // Recarrega quando um novo SW toma controle
          var refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", function() {
            if (!refreshing) { refreshing = true; window.location.reload(); }
          });
        });
      }
    </script>
  </body>
</html>
